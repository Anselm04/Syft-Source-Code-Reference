name: Verify pinned Git source tree syft
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/anchore/syft.git
      upstream_sha: e543a0007a0a2a812d13815a021b7a927f9013ac
      audit_slug: syft
